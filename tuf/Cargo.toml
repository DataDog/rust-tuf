[package]
name = "libdd-tuf"
edition = "2021"
version = "0.3.2"
rust-version = "1.87.0"
authors = [ "heartsucker <heartsucker@autistici.org>", "Erick Tryzelaar <etryzelaar@google.com>" ]
description = "Library for The Update Framework (TUF)"
homepage = "https://github.com/theupdateframework/rust-tuf"
repository = "https://github.com/theupdateframework/rust-tuf"
documentation = "https://docs.rs/tuf"
readme = "README.md"
license = "MIT/Apache-2.0"
keywords = [ "security", "update", "repository" ]
categories = [ "cryptography" ]

[lib]
name = "tuf"
path = "./src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = [ "serde" ] }
data-encoding = "2.0.0-rc.2"
derp = "0.0.15"
futures-io = "0.3.1"
futures-util = { version = "0.3.1", features = [ "io" ] }
http = { version = "0.2.0", optional = true }
hyper = { version = "0.14.15", default-features = false, features = [ "stream", "client", "http1" ], optional = true }
itoa = "1.0"
log = "0.4"
percent-encoding = "2.1"
ring = { version = "0.17" }
serde = "1"
serde_derive = "1"
serde_json = "1"
tempfile = "3"
thiserror = "2.0"
untrusted = "0.9"
url = { version = "2", optional = true }

[dev-dependencies]
assert_matches = "1.5.0"
futures-executor = "0.3.1"
lazy_static = "1"
maplit = "1"
pretty_assertions = "1"
# Flip `serde_json::Map` to `IndexMap` during `cargo test` so sort-dependent assertions are
# meaningful (matches what consumers like Vector enable in production).
serde_json = { version = "1", features = ["preserve_order"] }

[features]
default = ["hyper"]
hyper = ["dep:http", "dep:hyper", "dep:url", "hyper/tcp"]

wasm32_unknown_unknown_js = ["ring/wasm32_unknown_unknown_js"]

# FIXME(https://github.com/theupdateframework/rust-tuf/issues/329) - RSA key
# support does not yet conform to the TUF spec, so it is disabled by default.
# As a warning it may experience breaking changes without a major version bump.
unstable_rsa = []
