name: Rust

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "00 01 * * *"

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        rust:
          - stable
          - beta
          - nightly
          - "1.56.1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v1

      - name: Install Rust
        uses: actions-rs/toolchain/@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build

      - name: Run Tests
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: ${{ matrix.features }}

      - name: Run Tests with RSA
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: "--manifest-path tuf/Cargo.toml --features unstable_rsa"

  crypto-backends:
    name: crypto backend (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [ring, aws-lc-rs, fips]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # aws-lc-fips-sys builds the AWS-LC FIPS module with CMake and Go.
      - name: Install Go
        if: matrix.backend == 'fips'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Check dependency graph
        run: |
          backend=${{ matrix.backend }}
          tree() { cargo tree -e normal --no-default-features --features "$backend" -i "$1" 2>/dev/null; }
          if [ "$backend" != ring ] && [ -n "$(tree ring)" ]; then
            echo "ring is in the dependency graph"; tree ring; exit 1
          fi
          if [ "$backend" = fips ] && [ -n "$(tree aws-lc-sys)" ]; then
            echo "aws-lc-sys is in the dependency graph"; tree aws-lc-sys; exit 1
          fi
          # aws-lc-fips-sys 0.14 and later bundle AWS-LC-FIPS 4.x, which is not yet certified.
          if [ "$backend" = fips ] && ! tree aws-lc-fips-sys | head -n 1 | grep -q '^aws-lc-fips-sys v0\.13\.'; then
            echo "fips must use aws-lc-fips-sys 0.13 (AWS-LC-FIPS 3.x)"; tree aws-lc-fips-sys; exit 1
          fi

      - name: Run Tests
        run: cargo test -p tuf --no-default-features --features ${{ matrix.backend }},hyper,hyper/tcp

      - name: Run Tests with RSA
        run: cargo test -p tuf --no-default-features --features ${{ matrix.backend }},hyper,hyper/tcp,unstable_rsa

      - name: Run Interop Tests
        run: cargo test -p interop-tests --no-default-features --features ${{ matrix.backend }}

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v1

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v1

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal
          components: rustfmt

      - name: Check Clippy
        run: cargo clippy --all --tests --workspace -- -D warnings

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v1

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --workspace

  coverage:
    name: coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate code coverage
        run: cargo llvm-cov --workspace --features unstable_rsa --lcov --output-path lcov.info

      - name: Upload coverage to coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./lcov.info
